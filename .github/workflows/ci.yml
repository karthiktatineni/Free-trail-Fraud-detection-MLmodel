name: FraudGuard AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install fastapi uvicorn httpx pydantic

    - name: Run Data & Concept Drift Audit
      run: |
        python scripts/07_drift_monitor.py

    - name: Run Active Learning Feedback Loop
      run: |
        python scripts/08_active_learning_feedback.py

    - name: Execute Automated Unit & Integration Tests
      run: |
        python tests/test_suite.py

    - name: Build Docker Image
      run: |
        docker build -t fraudguard-ai:latest .
